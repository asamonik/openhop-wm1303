# systemd-journald limits for OpenHop WM1303 (TODO #14: log management)
#
# Deployed to /etc/systemd/journald.conf.d/zz-openhop.conf by install.sh and
# upgrade.sh. A drop-in is used instead of editing journald.conf directly so
# distribution upgrades never conflict with these settings.
#
# FILENAME IS LOAD-ORDER CRITICAL - DO NOT RENAME TO A NUMERIC PREFIX.
# systemd merges journald drop-ins by sorting the filenames across ALL search
# directories (/etc, /run, /usr/lib) and the LAST value read for a key wins.
# Raspberry Pi OS ships two drop-ins that collide with this file:
#   /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf -> Storage=volatile
#   /usr/lib/systemd/journald.conf.d/syslog.conf                  -> ForwardToSyslog=yes
# This file was originally named 10-openhop.conf, which sorts BEFORE both of
# them, so Storage=persistent and ForwardToSyslog=no were silently discarded on
# every boot while the remaining keys applied normally. The journal stayed in
# /run/log/journal (tmpfs) and every reboot erased all evidence, which is
# exactly the opposite of the intent below. The zz- prefix sorts after any
# numeric prefix and after syslog.conf, so these settings now take effect.
# Verify after any change with:  systemd-analyze cat-config systemd/journald.conf
#
# Rationale: the repeater logs continuously (RX/TX events, HAL stats, bridge
# decisions). With the Raspberry Pi OS default the journal may grow to 10% of
# the filesystem, which on a small SD card can fill the card after weeks of
# uptime and take the service down with it.
#
# SQLite metrics retention is handled separately by
# repeater/metrics_retention.py (8-day window, hourly cleanup, weekly VACUUM).

[Journal]
# Persistent journal on disk, so logs survive a reboot and stay available for
# post-mortem analysis after a watchdog-triggered restart or a power loss.
Storage=persistent

# Hard cap on total journal size. 200M holds several weeks of repeater logs
# while leaving ample free space on an 8/16 GB SD card.
SystemMaxUse=200M

# Never let the journal consume the last 100M of the filesystem, even when
# SystemMaxUse has not been reached yet.
SystemKeepFree=100M

# Cap individual rotated files so deletion is granular instead of dropping one
# large archive at a time.
SystemMaxFileSize=20M

# Time-based retention. Matches the 8-day SQLite metrics window so log evidence
# and metrics cover the same period when investigating an incident.
MaxRetentionSec=8day

# Rotate at least weekly, keeping individual files recent and small.
MaxFileSec=1week

# Rate limiting: keep bursts (for example a HAL error storm) from flooding the
# journal, while still allowing normal operational logging.
RateLimitIntervalSec=30s
RateLimitBurst=5000

# Forwarding to syslog is redundant here and doubles SD-card writes; journalctl
# is the single log interface for this project.
ForwardToSyslog=no
